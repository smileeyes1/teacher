<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مرافق المعلم الفلسطيني</title>

<style>
body{
  margin:0; padding:16px;
  background:#eef2f5;
  font-family:Tahoma;
}
.container{
  max-width:820px;
  margin:auto;
  background:#fff;
  padding:16px;
  border-radius:14px;
  box-shadow:0 4px 16px rgba(0,0,0,.08);
}
h1{
  color:#1f5d80;
  margin:0 0 12px;
}
p{margin:0 0 8px; color:#333}

.zone{
  background:#fafafa;
  border:1px dashed #ccc;
  border-radius:12px;
  padding:16px;
  margin-top:12px;
  line-height:1.8;
  min-height:120px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:12px;
}

button{
  padding:12px;
  font-size:14px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  background:#1f5d80;
  color:#fff;
}

@media print{
  .actions{display:none}
}
</style>
</head>

<body>
<div class="container">

<h1>مرافق المعلم الفلسطيني</h1>
<p>خبير • مرشد • مساعد عملي — دعم هادئ داخل الواقع الصفي</p>

<div class="actions">
  <button onclick="expert()">خبير</button>
  <button onclick="guide()">مرشد</button>
  <button onclick="helper()">مساعد</button>
</div>

<div class="zone" id="output">
اختر الدور الذي تحتاجه الآن.
</div>

</div>

<script>
function expert(){
  document.getElementById('output').textContent =
  "أنت في حصّة حقيقية، وقتك محدود، والصف مزدحم.\n" +
  "اختر مثالًا واحدًا فقط من الكتاب.\n" +
  "اكتب سؤالًا واحدًا من المثال.\n" +
  "اطرحه واصمت.\n" +
  "عند أول محاولة: توقّف.\n" +
  "هذا كافٍ مهنيًا الآن.";
}

function guide(){
  document.getElementById('output').textContent =
  "خذ نفسًا.\n" +
  "أنت لست متأخرًا ولا مقصّرًا.\n" +
  "إن حصلت محاولة واحدة، فتوقّف مطمئنًا.\n" +
  "التوقّف هنا حماية لك وللطلبة.\n" +
  "لا تحتاج أن تشرح أكثر.";
}

function helper(){
  document.getElementById('output').textContent =
  "الآن افعل خطوة واحدة فقط:\n" +
  "أعد السؤال نفسه مرة واحدة.\n" +
  "اصمت.\n" +
  "إن لم تحصل محاولة، توقّف أيضًا.\n" +
  "الحصّة انتهت بسلام.";
}
</script>

</body>
</html>
