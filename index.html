<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام المحاكاة التعليمية العميقة</title>

<style>
body {
  font-family: Arial, sans-serif;
  background-color: #f4f6f8;
  margin: 0;
  padding: 16px;
}

.container {
  background: #ffffff;
  max-width: 640px;
  margin: auto;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

label {
  font-weight: bold;
  display: block;
  margin-top: 12px;
}

input, textarea, select {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 16px;
}

textarea {
  resize: vertical;
}

.option-group {
  margin-top: 8px;
}

.option-group label {
  font-weight: normal;
}

button {
  margin-top: 20px;
  width: 100%;
  padding: 14px;
  font-size: 18px;
  background-color: #1976d2;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  background-color: #125aa0;
}

.output {
  margin-top: 24px;
}

.output textarea {
  height: 420px;
  white-space: pre-wrap;
  font-family: Tahoma, Arial, sans-serif;
}
</style>
</head>

<body>

<div class="container">
<h2>إنشاء محاكاة تعليمية عميقة</h2>

<label>المادة</label>
<input id="subject" placeholder="مثال: رياضيات – علوم – لغة عربية">

<label>الصف</label>
<input id="grade" placeholder="مثال: الثاني – الرابع">

<label>الوحدة (اختياري)</label>
<input id="unit" placeholder="اسم الوحدة إن وُجد">

<label>الدرس أو المفهوم</label>
<input id="lesson" placeholder="مثال: المقارنة بين عددين – الجملة الاسمية">

<label>مستوى الطلبة</label>
<select id="level">
  <option value="ضعاف">طلاب ضعاف</option>
  <option value="عادي" selected>صف عادي</option>
  <option value="موهوبين">طلاب موهوبين</option>
</select>

<label>نوع المحاكاة</label>
<div class="option-group">
  <input type="radio" name="type" value="عميقة" checked> عميقة<br>
  <input type="radio" name="type" value="علاجية"> علاجية<br>
  <input type="radio" name="type" value="إثرائية"> إثرائية
</div>

<label>الهدف العميق (اختياري)</label>
<textarea id="deepGoal" placeholder="ما الذي تريد أن يتغيّر في طريقة تفكير الطالب؟"></textarea>

<button onclick="generateSimulation()">إنشاء المحاكاة</button>

<div class="output">
<label>ناتج المحاكاة</label>
<textarea id="output" placeholder="سيظهر ناتج Gemini هنا..."></textarea>
</div>
</div>

<script>
/* ضع مفتاح Gemini هنا */
const GEMINI_API_KEY = "AIzaSyDVHQUv74yz3p65aeKlcTgvLZ30yC8wu14-GgnzJQ-GgnzJQ";

async function generateSimulation() {
  const subject = document.getElementById("subject").value || "غير محددة";
  const grade = document.getElementById("grade").value || "غير محدد";
  const unit = document.getElementById("unit").value || "—";
  const lesson = document.getElementById("lesson").value || "—";
  const level = document.getElementById("level").value;
  const deepGoal = document.getElementById("deepGoal").value;
  const type = document.querySelector('input[name="type"]:checked').value;

  const prompt = `
أنت نظام تربوي معماري محترف.

أنشئ محاكاة تعليمية ${type} عميقة وموجّهة بالأسئلة، مكيّفة حسب مستوى الطلبة.

المادة: ${subject}
الصف: ${grade}
الوحدة: ${unit}
الدرس: ${lesson}
مستوى الطلبة: ${level}

الهدف العميق:
${deepGoal || "إحداث تغيير مستقر في طريقة تفكير الطالب"}

استخدم الهيكل التالي:
- افتراض حدسي
- موقف كاشف
- احتكاك معرفي
- أسئلة موجّهة
- لحظة تحوّل مفاهيمي
- تسمية بعد الاكتشاف
- تطبيق
- نقل التعلّم
- تقويم عميق
`;

  const output = document.getElementById("output");
  output.value = "⏳ يتم التوليد من Gemini...";

  try {
    const response = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + GEMINI_API_KEY,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [
            {
              role: "user",
              parts: [{ text: prompt }]
            }
          ]
        })
      }
    );

    const data = await response.json();

    if (data.error) {
      output.value = "❌ خطأ من Gemini:\n" + JSON.stringify(data.error, null, 2);
      return;
    }

    if (!data.candidates || !data.candidates[0]) {
      output.value = "❌ لم يُرجع Gemini محتوى صالحًا.\nالرد:\n" + JSON.stringify(data, null, 2);
      return;
    }

    output.value = data.candidates[0].content.parts[0].text;

  } catch (err) {
    output.value = "❌ فشل الاتصال التقني:\n" + err.message;
  }
}
</script>

</body>
</html>
