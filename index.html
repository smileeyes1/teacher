<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الداعم التشغيلي الكامل — فلسطين</title>
<style>
:root{--bg:#eef2f5;--card:#fff;--accent:#1f5d80;--border:#ddd;--r:١٤px}
*{box-sizing:border-box;font-family:Tahoma}
body{margin:0;background:var(--bg);padding:١٦px}
.wrap{max-width:١٠٨٠px;margin:auto}
.card{background:var(--card);padding:١٦px;margin-bottom:١٦px;border-radius:var(--r);
box-shadow:0 ٤px ١٦px rgba(٠,٠,٠,.٠٨)}
h١,h٢{margin:٠ ٠ ٨px;color:var(--accent)}
input,button{width:١٠٠%;padding:١٢px;margin-top:٨px;font-size:١٥px;border-radius:١٠px;border:١px solid var(--border)}
button{background:var(--accent);color:#fff;border:none;cursor:pointer}
.zone{background:#fafafa;border:١px dashed #ccc;border-radius:١٢px;padding:١٤px;white-space:pre-wrap;line-height:١.٧}
.actions{display:flex;gap:٨px;margin-top:٨px}
.actions button{flex:١}
.hidden{display:none}
.lock{opacity:.٤;pointer-events:none}
@media print{input,button,.actions{display:none}}
</style>
</head>
<body>
<div class="wrap">

<div class="card">
  <h١>الداعم التشغيلي الكامل للمعلم الفلسطيني</h١>
</div>

<div class="card" id="bookGate">
  <h٢>اعتماد الكتاب (شرط تشغيل)</h٢>
  <input type="file" id="bookFile" accept=".pdf,image/*">
  <input type="url" id="bookLink" placeholder="رابط رسمي معتمد (اختياري)">
  <button onclick="approveBook()">اعتماد الكتاب</button>
  <div class="zone" id="bookStatus">الحالة: غير معتمد.</div>
</div>

<div class="card lock" id="runGate">
  <h٢>تشغيل</h٢>
  <input id="title" placeholder="عنوان الدرس كما في الكتاب">
  <input id="minutes" type="number" placeholder="مدة الحصّة بالدقائق (٣٠–٦٠)">
  <button onclick="RUN()">تشغيل الدعم</button>
</div>

<div class="card lock" id="prepCard">
  <h٢>تنظيم الحصة (آلي)</h٢>
  <div id="prep" class="zone"></div>
</div>

<div class="card lock" id="simCard">
  <h٢>سير الحصة (تشغيل صامت محسوب)</h٢>
  <div id="sim" class="zone"></div>
  <div class="actions">
    <button onclick="print()">طباعة</button>
    <button onclick="RESET()">إعادة</button>
  </div>
</div>

<div class="card lock" id="trackCard">
  <h٢>قائمة الرصد (ناتجة عن المسار)</h٢>
  <div id="track" class="zone"></div>
</div>

</div>

<script>
/* ====== سيادة: لا تشغيل بلا كتاب ====== */
let BOOK_APPROVED=false;
function approveBook(){
  const f=document.getElementById('bookFile').files.length>٠;
  const l=document.getElementById('bookLink').value.trim().length>٠;
  if(!f && !l){
    document.getElementById('bookStatus').textContent='الحالة: فشل صامت (لم يُعتمد كتاب).';
    return;
  }
  BOOK_APPROVED=true;
  document.getElementById('bookStatus').textContent='الحالة: مُعتمد كمنهاج رسمي وحيد.';
  unlock();
}
function unlock(){
  ['runGate','prepCard','simCard','trackCard'].forEach(id=>{
    document.getElementById(id).classList.remove('lock');
  });
}

/* ====== نواة دعم بلا قرارات ====== */
let minute=٠, pressure=٠, meaning=٠, timer=null;

function complexity(title){
  let s=Math.max((title||'').length,١٠);
  if(/تطبيق|تحليل|حل|مشكلات|تقويم/.test(title)) s+=١٤;
  if(/مراجعة|تمهيد|تعريف/.test(title)) s-=٨;
  return Math.max(s,١٠);
}
function slices(total){
  total=Math.min(Math.max(total||٤٥,٣٠),٦٠);
  return [Math.round(total*٠.٢٤), Math.round(total*٠.٦٠), total];
}
function tick(){
  const e=[
    {p:١,m:٠,t:'صمت طبيعي.'},
    {p:٠,m:١,t:'محاولة واحدة غير مكتملة.'},
    {p:١,m:٠,t:'تشتت خفيف قصير.'},
    {p:٠,m:١,t:'تركيز قصير على الفكرة.'}
  ];
  return e[Math.floor(Math.random()*e.length)];
}
function prepare(title,min){
  const c=complexity(title);
  const [a,b,T]=slices(min);
  return `العنوان: ${title||'درس من الكتاب'}
المدة: ${T} دقيقة
تعقيد مُحتسب: ${c}

المسار:
٠–${a} د: دخول هادئ.
${a}–${b} د: تشكّل جزئي للمعنى.
${b}–${T} د: شرط إغلاق محسوب.`;
}
function play(min){
  clearInterval(timer);
  minute=٠; pressure=٠; meaning=٠;
  const [a,b,T]=slices(min);
  const box=document.getElementById('sim');
  box.textContent='بدء الحصة…';
  timer=setInterval(()=>{
    minute++;
    const e=tick(); pressure+=e.p; meaning+=e.m;
    box.textContent+=`\n\nدقيقة ${minute}: ${e.t}\n(ضغط=${pressure} | معنى=${meaning})`;
    if(meaning>=٢ || pressure>=٤ || minute>=Math.ceil(T*٠.٧)){
      box.textContent+='\n\nإغلاق إلزامي.'; clearInterval(timer);
    }
  },١٢٠٠);
}
function tracking(title){
  const d=new Date().toLocaleDateString('ar-EG');
  return `الدرس: ${title||'—'}
التاريخ: ${d}

☐ حضور
☐ صمت طبيعي
☐ محاولة واحدة
☐ عدم تصويب علني
☐ إغلاق محسوب`;
}

/* ====== واجهة ====== */
function RUN(){
  if(!BOOK_APPROVED) return;
  const title=document.getElementById('title').value||'درس من الكتاب';
  const min=parseInt(document.getElementById('minutes').value)||٤٥;
  document.getElementById('prep').textContent=prepare(title,min);
  document.getElementById('track').textContent=tracking(title);
  play(min);
}
function RESET(){
  clearInterval(timer);
  document.getElementById('prep').textContent='';
  document.getElementById('sim').textContent='';
  document.getElementById('track').textContent='';
}
</script>
</body>
</html>
