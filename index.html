<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المرافق الصامت للحصّة</title>

<style>
body{
  font-family:Tahoma;
  background:#f4f6f8;
  padding:16px;
  color:#222;
}
.card{
  background:#fff;
  padding:20px;
  margin-bottom:16px;
  border-radius:14px;
  box-shadow:0 4px 16px rgba(0,0,0,0.08);
}
h1,h2{margin-top:0;color:#1f5d80}
textarea,button{
  width:100%;
  padding:14px;
  margin-top:10px;
  font-size:15px;
  border-radius:10px;
  border:1px solid #ccc;
}
textarea{min-height:120px}
button{
  background:#1f5d80;
  color:#fff;
  border:none;
  cursor:pointer;
}
.note{
  background:#e9f2f7;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  font-size:14px;
}
pre{
  background:#fafafa;
  padding:14px;
  border-radius:10px;
  white-space:pre-wrap;
}
@media print{
  body{background:#fff}
  textarea,button{display:none}
}
</style>
</head>

<body>

<div class="card">
  <h1>المرافق الصامت للحصّة</h1>
  <p>
    نظام ذكي ينتج محاكاة صفّية واقعية قابلة للتنفيذ.<br>
    يستخدم محتوى الكتاب أولًا، وإن تعذّر ينتقل إلى دعم آمن.
  </p>
</div>

<div class="card">
  <h2>نص الدرس من الكتاب (اختياري لكنه الأولوية)</h2>
  <textarea id="lessonText"
  placeholder="ألصق هنا نص الدرس كما هو من الكتاب..."></textarea>

  <div class="note">
    ✅ إن وُجد نص واضح → تُبنى المحاكاة عليه.<br>
    ✅ إن لم يوجد → النظام يدعمك تلقائيًا.
  </div>

  <button onclick="buildSimulation()">إنتاج المحاكاة الصفّية</button>
</div>

<div class="card" id="result"></div>

<script>
function detectType(text){
  text = text.toLowerCase();
  if(text.includes("اقرأ") || text.includes("قراءة") || text.includes("نص"))
    return "قرائي";
  if(text.includes("عد") || text.includes("احسب") || text.includes("اكتب"))
    return "عددي";
  if(text.includes("لاحظ") || text.includes("صورة") || text.includes("شاهد"))
    return "بصري";
  if(text.includes("استنتج") || text.includes("فسر") || text.includes("جرّب"))
    return "استقصائي";
  return "غير محدد";
}

function buildSimulation(){
  const text = lessonText.value.trim();
  let type = "غير محدد";

  if(text.length > 20){
    type = detectType(text);
  }

  let output = "";

  if(type === "قرائي"){
    output = `
الدرس قرائي (من محتوى الكتاب).

ما قد يحدث طبيعيًا:
- صمت
- قراءة فردية
- تردّد

التصرف المهني الصحيح:
- تطبيع التردد
- تثبيت أول محاولة

الإغلاق:
المحاولة أو الصمت كافيان.`;
  }

  else if(type === "عددي"){
    output = `
الدرس عددي (من محتوى الكتاب).

ما قد يحدث طبيعيًا:
- أخطاء
- بطء
- مشاركة جزئية

التصرف المهني الصحيح:
- قبول أول محاولة
- عدم التصويب العلني

الإغلاق:
التوقف بعد المحاولة الأولى كافٍ.`;
  }

  else if(type === "بصري"){
    output = `
الدرس بصري (من محتوى الكتاب).

ما قد يحدث طبيعيًا:
- وصف عام
- ملاحظات غير دقيقة

التصرف المهني الصحيح:
- تثبيت الملاحظة
- عدم التوسيع

الإغلاق:
التوقف بعد أول ملاحظة صائب.`;
  }

  else if(type === "استقصائي"){
    output = `
الدرس استقصائي (من محتوى الكتاب).

ما قد يحدث طبيعيًا:
- تردّد
- محاولات غير مكتملة

التصرف المهني الصحيح:
- قبول المحاولة
- عدم الضغط

الإغلاق:
التوقف بعد أول محاولة صحيح.`;
  }

  else{
    output = `
محاكاة ذكية عامة (دعم آمن).

ما قد يحدث طبيعيًا:
- صمت
- مشاركة جزئية
- إجابات تقريبية

التصرف المهني الصحيح:
- قبول ما يحدث
- المحافظة على الهدوء

الإغلاق:
التوقف بعد أول تفاعل كافٍ.`;
  }

  result.innerHTML = `
    <h2>المحاكاة الصفّية الجاهزة للتنفيذ</h2>
    <pre>${output}

----------------------------------
ملاحظة داعمة:
ما حدث في الحصّة كافٍ مهنيًا.
لا حاجة للإضافة أو القلق.
----------------------------------
</pre>
    <div class="note">
      🖨️ اطبع هذه الوثيقة وادخل الحصّة مباشرة.
    </div>
    <button onclick="window.print()">طباعة</button>
  `;
}
</script>

</body>
</html>
