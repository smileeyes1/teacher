<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسم الحصّة الصامت — فلسطين</title>

<style>
:root{
  --bg:#eef2f5;
  --card:#ffffff;
  --accent:#1f5d80;
  --soft:#e9f0f5;
  --txt:#222;
}
*{box-sizing:border-box;font-family:Tahoma}
body{
  margin:0; padding:14px;
  background:var(--bg); color:var(--txt);
}
.container{
  max-width:820px; margin:auto;
  background:var(--card);
  padding:18px;
  border-radius:16px;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
}
.title{
  font-size:18px; color:var(--accent);
  margin-bottom:10px;
}
.stage{
  background:var(--soft);
  border-radius:14px;
  padding:26px;
  text-align:center;
  font-size:16px;
  line-height:1.9;
  min-height:160px;
}
.controls{
  display:grid; grid-template-columns:1fr;
  gap:10px; margin-top:14px;
}
button{
  padding:18px;
  font-size:16px;
  border-radius:14px;
  border:none; cursor:pointer;
  background:var(--accent); color:#fff;
}
button.alt{
  background:#b7cddd; color:#0b2f44;
}
@media print{ .controls{display:none} }
</style>
</head>

<body>
<div class="container">

  <div class="title">حسم الحصّة الصامت</div>

  <div class="stage" id="stage">
    جاهز للاستخدام.<br>
    اضغط «ابدأ» وواصل الحصّة بهدوء.
  </div>

  <div class="controls">
    <button id="btn" onclick="toggle()">ابدأ</button>
    <button class="alt" onclick="forceStop()">أغلق الآن</button>
  </div>

</div>

<script>
let running=false, closed=false, t0=null, timer=null;
const AUTO_MS=300000; // خمس دقائق كحد صامت واقعي

function toggle(){
  if(closed) return;
  if(!running){
    running=true; t0=Date.now();
    document.getElementById('stage').innerHTML=
      'السؤال طُرح.<br>اصمت.<br>انتظر محاولة واحدة فقط.';
    document.getElementById('btn').textContent='قيد التشغيل';
    timer=setTimeout(autoStop, AUTO_MS);
  }
}

function autoStop(){
  if(closed) return;
  close('إغلاق محسوب تلقائيًا.');
}

function forceStop(){
  if(closed) return;
  close('⛔ أُغلق الآن.');
}

function close(note){
  closed=true; running=false; clearTimeout(timer);
  const sec=Math.max(0, Math.round((Date.now()-t0)/1000));
  document.getElementById('stage').innerHTML=
    note+'<br>مدة التفاعل: '+toArabic(sec)+' ثانية.<br>هذا كافٍ اليوم.';
  document.getElementById('btn').textContent='مغلق';
}

function toArabic(n){
  return String(n).replace(/\d/g, d=>'٠١٢٣٤٥٦٧٨٩'[d]);
}
</script>

</body>
</html>
