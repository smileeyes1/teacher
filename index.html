<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المرافق الصامت للحصّة | منهاج فلسطين</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --accent:#1f5d80;
  --soft:#e9f2f7; --text:#222; --muted:#666;
  --border:#ddd; --radius:14px;
}
*{box-sizing:border-box;font-family:"Tahoma","Segoe UI",sans-serif}
body{margin:0;background:var(--bg);color:var(--text);padding:16px}
.wrapper{max-width:960px;margin:auto}
.card{background:var(--card);padding:20px;margin-bottom:16px;border-radius:var(--radius);
box-shadow:0 4px 16px rgba(0,0,0,.06)}
h1{margin:0 0 8px;color:var(--accent);font-size:22px}
h2{margin:0 0 6px;font-size:18px}
p{margin:0;color:var(--muted);line-height:1.7}
select,input,button{
  width:100%;padding:14px;margin-top:10px;font-size:15px;
  border-radius:12px;border:1px solid var(--border)
}
button{background:var(--accent);color:#fff;border:none;cursor:pointer}
button.secondary{background:#aaa}
.note{background:var(--soft);padding:12px;border-radius:12px;margin-top:10px;font-size:14px}
output{display:block;background:#fafafa;border:1px dashed #ccc;padding:16px;margin-top:16px;
border-radius:12px;white-space:pre-wrap;font-size:14px}
@media (max-width:600px){h1{font-size:20px}h2{font-size:17px}}
@media print{body{background:#fff}select,input,button{display:none}}
</style>
</head>

<body>
<div class="wrapper">

<div class="card">
  <h1>المرافق الصامت للحصّة</h1>
  <p>
    خبير مرافق قبل الحصّة فقط.<br>
    المرجع الوحيد: الكتاب المدرسي الفلسطيني الحكومي.<br>
    الدعم يتمّ بحلّ السيناريوهات مسبقًا.
  </p>
</div>

<div class="card">
  <h2>١) الربط الرسمي بالكتاب</h2>
  <select id="grade">
    <option>الصف الأوّل</option>
    <option>الصف الثاني</option>
    <option>المرحلة الأساسية العليا</option>
    <option>المرحلة الثانوية</option>
  </select>

  <select id="subject">
    <option>الرياضيات</option>
    <option>اللغة العربية</option>
    <option>العلوم</option>
    <option>التربية الوطنية</option>
  </select>

  <input id="page" type="number" placeholder="رقم الصفحة في الكتاب (إلزامي)"/>

  <div class="note">
    الربط الرسمي يتم عبر الصفحة فقط.<br>
    الفكرة والسؤال يؤخذان من الكتاب الورقي.
  </div>

  <button onclick="buildPath()">حضّر مسار الحصّة</button>
</div>

<div class="card" id="result"></div>

</div>

<script>
function buildPath(){
  if(!page.value){ alert("يرجى إدخال رقم الصفحة"); return; }

  const header =
`مسار حصّة — معتمد رسميًا
الصف: ${grade.value}
المبحث: ${subject.value}
الصفحة: ${page.value}
المرجع: الكتاب المدرسي الفلسطيني الحكومي

الفكرة: (تُحدَّد من نص الصفحة)
السؤال: (سؤال واحد من الصفحة)

`;

  const body =
`السيناريوهات المحتملة (محلولة مسبقًا):

(أ) مشاركة جزئية:
- رد مهني: تثبيت المحاولة دون تعميم.
- الإغلاق: المشاركة الجزئية كافية — التوقّف صحيح.

(ب) إجابات غير دقيقة:
- رد مهني: قبول الفكرة العامة دون تصويب علني.
- الإغلاق: المحاولة تحقّقت — التوقّف حكمة.

(ج) صمت أو تردّد:
- رد مهني: تطبيع الصمت والتفكير الهادئ.
- الإغلاق: الصمت ليس فشلًا — التوقّف قرار تربوي.

إقرار مهني:
في جميع الحالات السابقة، الإغلاق بعد أول محاولة أو صمت كامل قرار صحيح ولا يحتاج تبريرًا.
`;

  result.innerHTML = `
    <h2>وثيقة مسار الحصّة</h2>
    <output>${header}${body}</output>
    <button class="secondary" onclick="window.print()">طباعة الوثيقة</button>
  `;
}
</script>
</body>
</html>
