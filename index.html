<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>محاكاة حصّة صفّية حقيقية</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Tahoma;
  background:#f4f6f8;
  padding:20px;
}
.card{
  background:#fff;
  padding:20px;
  border-radius:14px;
  box-shadow:0 4px 16px rgba(0,0,0,0.08);
}
h1{color:#1f5d80}
#screen{
  background:#fafafa;
  padding:16px;
  border-radius:12px;
  min-height:220px;
  white-space:pre-wrap;
  font-size:15px;
}
button{
  width:100%;
  padding:14px;
  margin-top:16px;
  background:#1f5d80;
  color:#fff;
  border:none;
  font-size:15px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="card">
  <h1>محاكاة صفّية حقيقية</h1>
  <p>
    هذه ليست خطة.<br>
    هذه حصة افتراضية تتقدّم تلقائيًا كما يحدث في الصف.
  </p>

  <div id="screen"></div>

  <button onclick="startSimulation()">ابدأ المحاكاة</button>
</div>

<script>
const steps = [
  "🔔 بداية الحصّة\nالطلبة يجلسون.\nالمعلّم يفتح الكتاب على الدرس.",

  "❓ طرح السؤال من الكتاب.\nالمعلّم يسأل سؤالًا واحدًا فقط.",

  "⏳ تمرّ بضع ثوانٍ...\nالطلبة ينظرون.\nلا أحد يجيب فورًا.",

  "🧠 ملاحظة صفّية:\nهذا صمت طبيعي.\nلا حاجة للتدخّل أو التكرار.",

  "🗣️ محاولة فردية:\nطالب واحد يجيب إجابة غير مكتملة.",

  "✅ ردّ مهني تلقائي:\n\"شكرًا لمحاولتك.\nنسمعك.\"",

  "📉 لا تصويب علني.\nلا مقارنة.\nلا ضغط.",

  "🛑 قرار مهني:\nالمحاولة كافية.\nالإغلاق الآن صحيح.",

  "✅ نهاية الحصّة:\nما حدث كافٍ.\nلا حاجة للإضافة."
];

let index = 0;
let interval;

function startSimulation(){
  index = 0;
  screen.textContent = "";
  clearInterval(interval);

  interval = setInterval(()=>{
    screen.textContent += steps[index] + "\n\n";
    index++;
    if(index === steps.length){
      clearInterval(interval);
    }
  }, 2000);
}
</script>

</body>
</html>
