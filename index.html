<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الداعم التربوي للمعلّم الفلسطيني</title>

<style>
:root{
  --bg:#f4f6f8; --card:#fff; --accent:#1f5d80;
  --soft:#e9f2f7; --text:#222; --muted:#666;
  --border:#ddd; --radius:14px; --font:14px;
}

*{box-sizing:border-box;font-family:"Tahoma","Segoe UI",sans-serif}
body{margin:0;background:var(--bg);color:var(--text);padding:16px;font-size:var(--font)}
.wrapper{max-width:960px;margin:auto}

.card{
  background:var(--card);padding:20px;margin-bottom:16px;
  border-radius:var(--radius);
  box-shadow:0 4px 16px rgba(0,0,0,.06);
}

h1{margin:0 0 8px;color:var(--accent);font-size:22px}
h2{margin:0 0 6px;font-size:18px}
p{margin:0;color:var(--muted);line-height:1.7}

select,button{
  width:100%;padding:14px;margin-top:10px;
  font-size:15px;border-radius:12px;border:1px solid var(--border)
}
button{background:var(--accent);color:#fff;border:none;cursor:pointer}
button.secondary{background:#aaa}
button.light{background:#ddd;color:#000}

.note{background:var(--soft);padding:12px;border-radius:12px;margin-top:10px;font-size:14px}

output{
  display:block;background:#fafafa;border:1px dashed #ccc;
  padding:16px;margin-top:16px;border-radius:12px;white-space:pre-wrap
}

.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

@media print{
  body{background:#fff}
  button, select, .controls{display:none}
}
</style>
</head>

<body>
<div class="wrapper">

<div class="card">
  <h1>الداعم التربوي للمعلّم الفلسطيني</h1>
  <p>خبير مرافق قبل الحصّة — النظام يقترح، وأنت تختار.</p>
</div>

<div class="card">
  <h2>١) سياق الحصّة</h2>

  <select id="grade">
    <option>الصف الأوّل</option>
    <option>الصف الثاني</option>
    <option>المرحلة الأساسية العليا</option>
    <option>المرحلة الثانوية</option>
  </select>

  <select id="subject" onchange="updateScenarios()">
    <option>الرياضيات</option>
    <option>اللغة العربية</option>
    <option>العلوم</option>
  </select>

  <div class="note">
    • كتاب المنهاج هو المرجع الوحيد<br>
    • فكرة واحدة – سؤال واحد – إغلاق واعٍ
  </div>

  <div class="controls">
    <button class="light" onclick="zoom(true)">تكبير الخط</button>
    <button class="light" onclick="zoom(false)">تصغير الخط</button>
  </div>
</div>

<div class="card">
  <h2>٢) محاكاة الصف الواقعي</h2>
  <div id="scenarios"></div>
</div>

<div class="card" id="result"></div>

</div>

<script>
const scenarioMap = {
  "الرياضيات":[
    ["partial","شارك عدد قليل من الطلبة"],
    ["imprecise","كانت الإجابات غير دقيقة"],
    ["silence","ساد صمت أو تردّد"]
  ],
  "اللغة العربية":[
    ["partial","قرأ طالب واحد فقط"],
    ["imprecise","الأصوات غير واضحة"],
    ["silence","تردّد عام في القراءة"]
  ],
  "العلوم":[
    ["partial","شارك عدد قليل بالملاحظة"],
    ["imprecise","الاستنتاجات غير دقيقة"],
    ["silence","صمت أثناء الملاحظة"]
  ]
};

function updateScenarios(){
  const s = subject.value;
  scenarios.innerHTML="";
  scenarioMap[s].forEach(x=>{
    scenarios.innerHTML += `<button onclick="simulate('${x[0]}')">${x[1]}</button>`;
  });
  localStorage.setItem("lastSubject",s);
}

function simulate(state){
  const header =
`تحضير حصّة — معتمد
الصف: ${grade.value}
المبحث: ${subject.value}

`;

  const bodies={
    partial:`الرد المهني:\nتثبيت المحاولة.\n\nالقرار:\nالمشاركة كافية — الإغلاق صحيح.`,
    imprecise:`الرد المهني:\nقبول الفكرة العامة.\n\nالقرار:\nالمحاولة تحقّقت — الإغلاق صحيح.`,
    silence:`الرد المهني:\nتطبيع الصمت.\n\nالقرار:\nالصمت ليس فشلًا — الإغلاق صحيح.`
  };

  result.innerHTML=`
<h2>المخرج المعتمد</h2>
<output>${header}${bodies[state]}</output>
<div class="controls">
  <button class="secondary" onclick="window.print()">طباعة التحضير</button>
  <button class="light" onclick="printCard()">بطاقة صفّية</button>
</div>`;
}

function printCard(){
  const o = document.querySelector("output").innerText;
  const w = window.open();
  w.document.write(`<pre style="font-family:Tahoma">${o}</pre>`);
  w.print();
}

function zoom(up){
  let f = parseInt(getComputedStyle(document.body).fontSize);
  document.body.style.fontSize = (up?f+1:f-1)+"px";
}

updateScenarios();
</script>

</body>
</html>
