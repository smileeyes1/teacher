<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المرافق الصامت للحصّة</title>

<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --accent:#1f5d80;
  --soft:#e9f2f7; --text:#222; --muted:#666;
  --border:#ddd; --radius:14px;
}
*{box-sizing:border-box;font-family:Tahoma,"Segoe UI",sans-serif}
body{margin:0;background:var(--bg);color:var(--text);padding:16px}
.wrapper{max-width:960px;margin:auto}
.card{
  background:var(--card);padding:20px;margin-bottom:16px;
  border-radius:var(--radius);
  box-shadow:0 4px 16px rgba(0,0,0,.08);
}
h1{margin:0 0 8px;color:var(--accent);font-size:22px}
h2{margin:0 0 6px;font-size:18px}
p{margin:0;color:var(--muted);line-height:1.7}
textarea,button{
  width:100%;padding:14px;margin-top:10px;
  font-size:15px;border-radius:12px;border:1px solid var(--border)
}
textarea{min-height:120px;resize:vertical}
button{background:var(--accent);color:#fff;border:none;cursor:pointer}
.note{background:var(--soft);padding:12px;border-radius:12px;margin-top:10px;font-size:14px}
pre{
  background:#fafafa;border:1px dashed #ccc;
  padding:16px;border-radius:12px;white-space:pre-wrap;font-size:14px
}
@media print{
  body{background:#fff}
  textarea,button{display:none}
}
</style>
</head>

<body>
<div class="wrapper">

<!-- رأس النظام -->
<div class="card">
  <h1>المرافق الصامت للحصّة</h1>
  <p>
    نظام ذكي يُنتج محاكاة صفّية عملية قابلة للتنفيذ.<br>
    يستخدم محتوى الكتاب أولًا، وإن تعذّر يعتمد ذكاءً تربويًا آمنًا.<br>
    ما سيحدث في الحصّة محسوب ومقبول.
  </p>
</div>

<!-- إدخال اختياري من الكتاب -->
<div class="card">
  <h2>نص الدرس من الكتاب (اختياري)</h2>
  <textarea id="lessonText" placeholder="ألصق هنا سطرًا أو سطرين من الدرس إن رغبت..."></textarea>
  <div class="note">
    ✅ إن وُجد نص واضح → تُبنى المحاكاة عليه.<br>
    ✅ إن لم يُدخل شيء → تنتج محاكاة عامة واقعية وآمنة.
  </div>
  <button onclick="generateSimulation()">إنتاج المحاكاة الصفّية</button>
</div>

<!-- المخرج -->
<div class="card" id="result"></div>

</div>

<script>
function recognizeFromContent(text){
  const t = text.toLowerCase();
  let nature="عام", load="متوسط";

  if(t.includes("اقرأ")||t.includes("نص")){
    nature="قرائي"; load="متوسط";
  } else if(t.includes("عد")||t.includes("احسب")||t.includes("اكتب")){
    nature="عددي"; load="مرتفع";
  } else if(t.includes("لاحظ")||t.includes("صورة")||t.includes("شاهد")){
    nature="بصري"; load="منخفض";
  } else if(t.includes("استنتج")||t.includes("فسر")||t.includes("جرّب")){
    nature="استقصائي"; load="مرتفع";
  }

  return {nature, load};
}

function buildSimulation(nature, load){
  let s =
`نوع الدرس: ${nature}
العبء المتوقع: ${load}

الجوانب النفسية المرجّحة:
- تردّد طبيعي
- خوف من الخطأ
- تفاوت مشاركة
- صمت وظيفي خصوصًا في البداية

التفسير التربوي:
هذه استجابات طبيعية وليست مؤشر ضعف.
`;

  if(load==="مرتفع"){
    s+=
`التصرف المهني الآمن:
- قبول أول محاولة
- عدم التصويب العلني
- تخفيف الوتيرة

قرار الإغلاق:
التوقف بعد أول محاولة أو صمت كامل صحيح مهنيًا.
`;
  } else if(load==="متوسط"){
    s+=
`التصرف المهني الآمن:
- تطبيع التردّد
- سؤال واحد فقط
- تثبيت المحاولة

قرار الإغلاق:
التوقف بعد أول تفاعل مفهوم كافٍ.
`;
  } else {
    s+=
`التصرف المهني الآمن:
- تثبيت الملاحظة
- عدم التوسّع
- الحفاظ على الهدوء

قرار الإغلاق:
التوقف المبكر يعزّز الأمان.
`;
  }

  s+=
`------------------------------------------------
ملاحظة داعمة للمعلّم:
ما حدث في الحصّة كافٍ مهنيًا.
التوقف هنا جودة لا تقصير.
------------------------------------------------`;

  return s;
}

function generateSimulation(){
  const text = lessonText.value.trim();
  let rec;

  if(text.length>20){
    rec = recognizeFromContent(text);   // أولوية المحتوى
  }else{
    rec = {nature:"عام", load:"متوسط"}; // ذكاء آمن افتراضي
  }

  const simulation = buildSimulation(rec.nature, rec.load);

  document.getElementById("result").innerHTML =
  `<h2>المحاكاة الصفّية الجاهزة للتنفيذ</h2>
   <pre>${simulation}</pre>
   <div class="note">🖨️ اطبع وادخل الحصّة بثقة.</div>
   <button onclick="window.print()">طباعة</button>`;
}
</script>

</body>
</html>
