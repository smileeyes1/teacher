<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الداعم الخبير — الرياضيات | الصفّ الأوّل</title>

<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#222;
  --muted:#666;
  --accent:#1f5d80;
  --soft:#e9f2f7;
  --border:#ddd;
}
*{box-sizing:border-box;font-family:"Segoe UI","Tahoma",sans-serif;}
body{margin:٠;background:var(--bg);color:var(--text);}
.container{max-width:٨٢٠px;margin:auto;padding:١٦px;}
.card{
  background:var(--card);
  border-radius:١٤px;
  padding:٢٠px;
  box-shadow:٠ ٤px ١٦px rgba(٠,٠,٠,٠.٠٦);
  margin-bottom:١٦px;
}
h1{margin:٠ ٠ ٨px;font-size:٢٢px;color:var(--accent);}
h2{margin:٠ ٠ ٨px;font-size:١٨px;}
p{margin:٠;color:var(--muted);line-height:١.٦;}

select,button{
  width:١٠٠%;
  padding:١٤px;
  border-radius:١٢px;
  border:١px solid var(--border);
  margin-top:١٠px;
  font-size:١٥px;
}
button{
  background:var(--accent);
  color:#fff;
  border:none;
}
button.secondary{background:#aaa;}

.note{
  background:var(--soft);
  padding:١٢px;
  border-radius:١٠px;
  margin-top:١٠px;
  font-size:١٤px;
}

output{
  display:block;
  background:#fafafa;
  border:١px dashed #ccc;
  border-radius:١٠px;
  padding:١٦px;
  margin-top:١٦px;
  white-space:pre-wrap;
  font-size:١٤px;
}

@media(max-width:٦٠٠px){
  h1{font-size:٢٠px;}
  h2{font-size:١٧px;}
}
</style>
</head>

<body>
<div class="container">

  <div class="card">
    <h1>الداعم الخبير للمعلّم</h1>
    <p>
      مقيَّد بكتاب <strong>الرياضيات — الصفّ الأوّل</strong>.<br>
      لا يطلب منك شرحًا أو تخطيطًا… أنت تختار فقط.
    </p>
  </div>

  <div class="card">
    <h2>١) نوع درس الرياضيات</h2>
    <select id="lesson">
      <option>الأعداد (تعرّف / تسمية)</option>
      <option>العدّ الشفهي</option>
      <option>مقارنة كميّات</option>
      <option>العلاقة بين عددين</option>
      <option>نشاط عملي بسيط</option>
    </select>

    <div class="note">
      مأخوذ من بنية دروس الرياضيات في الصفّ الأوّل.
    </div>
  </div>

  <div class="card">
    <h2>٢) نمط السؤال المسموح</h2>
    <select id="question">
      <option>كم ترى هنا؟</option>
      <option>أيّهما أكثر؟</option>
      <option>من يستطيع العدّ؟</option>
      <option>هل الأعداد متساوية؟</option>
    </select>

    <div class="note">
      الإشارة، العدّ الجماعي، أو الصمت… جميعها مقبولة.
    </div>
  </div>

  <div class="card">
    <h2>٣) الإغلاق التربوي المعتمد</h2>
    <select id="closure">
      <option>محاولة واحدة — الإغلاق صحيح</option>
      <option>محاولات غير دقيقة — الإغلاق صحيح</option>
      <option>تفاعل جسدي فقط — الإغلاق صحيح</option>
    </select>

    <button onclick="generate()">اعتماد القرار</button>
    <button class="secondary" onclick="resetAll()">تفريغ</button>

    <output id="result"></output>
  </div>

</div>

<script>
function generate(){
  result.textContent =
`قرار تربوي — الرياضيات (الصفّ الأوّل)

نوع الدرس:
${lesson.value}

نمط السؤال:
${question.value}

قرار الإغلاق:
${closure.value}

ملاحظة مهنية:
الكتاب هو المرجع.
التوقّف هنا صحيح.`;
}

function resetAll(){
  document.querySelectorAll("select").forEach(s=>s.selectedIndex=٠);
  result.textContent="";
}
</script>

</body>
</html>
