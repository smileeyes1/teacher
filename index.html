<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>محاكاة صفّية واقعية</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Tahoma;
  background:#f4f6f8;   /* ✅ خلفية فاتحة */
  color:#222;
  margin:0;
  padding:20px;
}

.card{
  background:#ffffff;
  padding:20px;
  border-radius:14px;
  box-shadow:0 4px 16px rgba(0,0,0,.08);
  max-width:700px;
  margin:auto;
}

h1{color:#1f5d80}

#screen{
  background:#fafafa;
  border:1px dashed #ccc;
  border-radius:12px;
  padding:16px;
  min-height:240px;
  white-space:pre-wrap;
  font-size:15px;
  line-height:1.7;
}
</style>
</head>

<body>

<div class="card">
  <h1>محاكاة صفّية واقعية</h1>
  <p>
    هذه محاكاة تعمل تلقائيًا.<br>
    ما يظهر الآن هو ما يحدث في الصف خطوة بخطوة.
  </p>

  <div id="screen">⏳ جاري بدء الحصّة…</div>
</div>

<script>
const timeline = [
  "🔔 بداية الحصّة\nالطلبة يدخلون الصف.",
  "📖 المعلّم يفتح الكتاب\nويطرح سؤالًا واحدًا فقط.",
  "⏳ لحظات صمت...\nلا أحد يجيب فورًا.",
  "🧠 قرار مهني تلقائي:\nهذا صمت طبيعي.",
  "👤 طالب واحد يحاول الإجابة.\nالإجابة غير مكتملة.",
  "✅ الردّ الصحيح:\n«شكرًا لمحاولتك»\nلا تصويب، لا ضغط.",
  "🛑 قرار الإغلاق:\nالمحاولة كافية.\nالتوقّف الآن صحيح.",
  "✅ نهاية الحصّة:\nما حدث كافٍ.\nلا حاجة للإضافة."
];

let i = 0;
const screen = document.getElementById("screen");

function play(){
  if(i < timeline.length){
    screen.textContent += "\n\n" + timeline[i];
    i++;
    setTimeout(play, 1800);
  }
}

/* ✅ تبدأ تلقائيًا */
setTimeout(()=>{
  screen.textContent = timeline[0];
  i = 1;
  setTimeout(play, 1800);
}, 800);
</script>

</body>
</html>
