<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>واجهة إنشاء محاكاة تعليمية</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 16px;
    }

    .container {
      background: #ffffff;
      max-width: 600px;
      margin: auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 12px;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .radio-group {
      margin-top: 8px;
    }

    .radio-group label {
      font-weight: normal;
      margin-left: 10px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      font-size: 18px;
      background-color: #1976d2;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #125aa0;
    }

    .output {
      margin-top: 24px;
    }

    textarea.output-area {
      height: 360px;
      resize: vertical;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>إنشاء محاكاة تعليمية</h2>

  <label>المادة</label>
  <input id="subject" type="text" placeholder="مثال: رياضيات، علوم، لغة عربية">

  <label>الصف</label>
  <input id="grade" type="text" placeholder="مثال: الثاني، الخامس">

  <label>الوحدة</label>
  <input id="unit" type="text" placeholder="اختياري">

  <label>الدرس أو المفهوم</label>
  <input id="lesson" type="text" placeholder="مثال: الكسور، الجملة الاسمية">

  <label>نوع المحاكاة</label>
  <div class="radio-group">
    <input type="radio" name="type" value="عميقة" checked> <label>عميقة</label><br>
    <input type="radio" name="type" value="علاجية"> <label>علاجية</label><br>
    <input type="radio" name="type" value="إثرائية"> <label>إثرائية</label>
  </div>

  <label>الهدف العميق (اختياري)</label>
  <textarea id="deepGoal" placeholder="ما الذي تريد أن يتغير في طريقة تفكير الطالب؟"></textarea>

  <button onclick="generateSimulation()">إنشاء المحاكاة</button>

  <div class="output">
    <label>ناتج المحاكاة</label>
    <textarea class="output-area" id="output" placeholder="ستظهر المحاكاة هنا..."></textarea>
  </div>
</div>

<script>
function generateSimulation() {
  const subject = document.getElementById("subject").value || "غير محددة";
  const grade = document.getElementById("grade").value || "غير محدد";
  const unit = document.getElementById("unit").value || "—";
  const lesson = document.getElementById("lesson").value || "—";
  const deepGoal = document.getElementById("deepGoal").value;
  const type = document.querySelector('input[name="type"]:checked').value;

  const simulation = `
محاكاة تعليمية ${type}

المادة: ${subject}
الصف: ${grade}
الوحدة: ${unit}
الدرس / المفهوم: ${lesson}

الفكرة المركزية:
تحويل المفهوم إلى تجربة حيّة يعيشها الطالب قبل أن يسمّيها.

بداية المحاكاة:
يبدأ المعلم بسؤال واقعي أو موقف من حياة الطالب له علاقة مباشرة بالمفهوم،
دون ذكر تعريف أو قاعدة.

تجربة صفّية:
يُطلب من الطلبة التفاعل مع الموقف، اتخاذ قرار، أو تقديم تفسير،
ثم تُناقش الإجابات جماعيًا لاكتشاف الفكرة الأساسية.

لحظة الإدراك:
يوجّه المعلم النقاش حتى يصل الطلبة بأنفسهم إلى جوهر المفهوم،
ويُترك للطلبة التعبير عنه بألفاظهم.

إدخال الرمز أو القاعدة:
تُقدَّم القاعدة أو المصطلح بعد الفهم، بوصفه اسمًا لما تم اكتشافه.

نشاط عكسي:
يُطلب من الطلبة ابتكار مثال جديد يطبق المفهوم في سياق مختلف.

التقويم العميق:
يُقيَّم الفهم من خلال سؤال يطلب تفسيرًا أو قرارًا، لا اختيارًا مباشرًا.

الهدف العميق:
${deepGoal || "إعادة بناء فهم الطالب للمفهوم بطريقة أعمق وأكثر ثباتًا."}

إرشاد للمعلم:
ركّز على الحوار، وتجنّب الإسراع في إعطاء الإجابة.
`;

  document.getElementById("output").value = simulation.trim();
}
</script>

</body>
</html>
