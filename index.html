<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>المرافق اليومي للمعلم الفلسطيني</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Tahoma;
  background:#eef2f5;
  margin:0;
  padding:20px;
}
.section{
  background:#fff;
  padding:20px;
  margin-bottom:16px;
  border-radius:14px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
  max-width:900px;
  margin-left:auto;
  margin-right:auto;
}
h1,h2{color:#1f5d80;margin-top:0}
input,select,button{
  width:100%;
  padding:12px;
  margin-top:8px;
  font-size:15px;
  border-radius:10px;
  border:1px solid #ccc;
}
button{
  background:#1f5d80;
  color:#fff;
  border:none;
  cursor:pointer;
}
.output{
  background:#fafafa;
  border:1px dashed #ccc;
  border-radius:12px;
  padding:16px;
  white-space:pre-wrap;
  line-height:1.7;
}
@media print{
  button,input,select{display:none}
}
</style>
</head>

<body>

<div class="section">
  <h1>المرافق اليومي للمعلم الفلسطيني</h1>
  <p>أداة عملية ترافقك في التحضير، التنفيذ، والرصد — بدون تعبئة وبدون شرح إضافي.</p>
</div>

<div class="section">
  <h2>مدخلات الحصة (الحد الأدنى)</h2>
  <input id="lesson" placeholder="عنوان الدرس كما في الكتاب">
  <select id="subject">
    <option value="math">رياضيات</option>
    <option value="civics">تربية وطنية</option>
    <option value="science">علوم</option>
  </select>
  <input id="duration" type="number" placeholder="مدة الحصة بالدقائق (مثال 45)">
  <button onclick="run()">تنظيم الحصة</button>
</div>

<div class="section">
  <h2>محاكاة وتنظيم الحصة</h2>
  <div id="simulation" class="output">بانتظار التنفيذ…</div>
</div>

<div class="section">
  <h2>قائمة الرصد (جاهزة للطباعة)</h2>
  <div id="tracking" class="output"></div>
</div>

<script>
function run(){
  const lesson = lesson.value || "درس من الكتاب";
  const duration = parseInt(document.getElementById("duration").value) || 45;
  const subject = document.getElementById("subject").value;

  let start = Math.round(duration * 0.2);
  let middle = Math.round(duration * 0.5);
  let end = duration - start - middle;

  let sim = "";

  if(subject==="math"){
    sim = `
عنوان الدرس: ${lesson}

الدقائق 0–${start}:
بداية هادئة – عرض مثال واحد – تردد طبيعي.

الدقائق ${start}–${start+middle}:
محاولات حل – أخطاء جزئية – مشاركة فردية واحدة.

الدقائق ${start+middle}–${duration}:
الفكرة بدأت تتضح.
⛔ الإغلاق الآن صحيح ومهني.
`;
  }
  if(subject==="civics"){
    sim = `
عنوان الدرس: ${lesson}

الدقائق 0–${start}:
قراءة فقرة أو موقف – صمت تفكيري.

الدقائق ${start}–${start+middle}:
إجابات عامة – حذر في التعبير – لا تصويب.

الدقائق ${start+middle}–${duration}:
الفكرة زُرعت.
⛔ الإغلاق المبكر يحمي القيمة.
`;
  }
  if(subject==="science"){
    sim = `
عنوان الدرس: ${lesson}

الدقائق 0–${start}:
ملاحظة أو تجربة بسيطة – تركيز بصري.

الدقائق ${start}–${start+middle}:
تخمينات غير دقيقة – نقاش محدود.

الدقائق ${start+middle}–${duration}:
الاستنتاج الأولي تحقق.
⛔ الإغلاق الآن كافٍ.
`;
  }

  document.getElementById("simulation").textContent =
sim + "\n✅ قرار مهني: التوقف هنا جودة وليس تقصير.";

  document.getElementById("tracking").textContent =
`قائمة رصد مختصرة:

□ حضر الطلبة
□ محاولة واحدة على الأقل
□ صمت طبيعي
□ مشاركة فردية
□ لا ضغط
□ إغلاق صحيح`;
}
</script>

</body>
</html>
