<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الداعم التشغيلي الكامل — فلسطين</title>
<style>
:root{--bg:#eef2f5;--card:#fff;--accent:#1f5d80;--border:#ddd;--r:14px}
*{box-sizing:border-box;font-family:Tahoma}
body{margin:0;background:var(--bg);padding:16px}
.wrap{max-width:1080px;margin:auto}
.card{background:var(--card);padding:16px;margin-bottom:16px;border-radius:var(--r);
box-shadow:0 4px 16px rgba(0,0,0,.08)}
h1,h2{margin:0 0 8px;color:var(--accent)}
input,button{width:100%;padding:12px;margin-top:8px;font-size:15px;border-radius:10px;border:1px solid var(--border)}
button{background:var(--accent);color:#fff;border:none;cursor:pointer}
.zone{background:#fafafa;border:1px dashed #ccc;border-radius:12px;padding:14px;white-space:pre-wrap;line-height:1.7}
.actions{display:flex;gap:8px;margin-top:8px}
.actions button{flex:1}
.hidden{display:none}
.lock{opacity:.4;pointer-events:none}
@media print{input,button,.actions{display:none}}
</style>
</head>
<body>
<div class="wrap">

<div class="card">
  <h1>الداعم التشغيلي الكامل للمعلم الفلسطيني</h1>
</div>

<div class="card" id="bookGate">
  <h2>اعتماد الكتاب (شرط تشغيل)</h2>
  <input type="file" id="bookFile" accept=".pdf,image/*">
  <input type="url" id="bookLink" placeholder="رابط رسمي معتمد (اختياري)">
  <button onclick="approveBook()">اعتماد الكتاب</button>
  <div class="zone" id="bookStatus">الحالة: غير معتمد.</div>
</div>

<div class="card lock" id="runGate">
  <h2>تشغيل</h2>
  <input id="title" placeholder="عنوان الدرس كما في الكتاب">
  <input id="minutes" type="number" placeholder="مدة الحصّة بالدقائق (30–60)">
  <button onclick="RUN()">تشغيل الدعم</button>
</div>

<div class="card lock" id="prepCard">
  <h2>تنظيم الحصة (آلي)</h2>
  <div id="prep" class="zone"></div>
</div>

<div class="card lock" id="simCard">
  <h2>سير الحصة (تشغيل صامت محسوب)</h2>
  <div id="sim" class="zone"></div>
  <div class="actions">
    <button onclick="print()">طباعة</button>
    <button onclick="RESET()">إعادة</button>
  </div>
</div>

<div class="card lock" id="trackCard">
  <h2>قائمة الرصد (ناتجة عن المسار)</h2>
  <div id="track" class="zone"></div>
</div>

</div>

<script>
/* ====== سيادة: لا تشغيل بلا كتاب ====== */
let BOOK_APPROVED=false;
let SESSION_ID=Date.now();
function approveBook(){
  const f=document.getElementById('bookFile').files.length>0;
  const l=document.getElementById('bookLink').value.trim().length>0;
  if(!f && !l){
    document.getElementById('bookStatus').textContent='الحالة: فشل صامت (لم يُعتمد كتاب).';
    return;
  }
  BOOK_APPROVED=true;
  document.getElementById('bookStatus').textContent='الحالة: مُعتمد كمنهاج رسمي وحيد.';
  unlock();
}
function unlock(){
  ['runGate','prepCard','simCard','trackCard'].forEach(id=>{
    document.getElementById(id).classList.remove('lock');
  });
}

/* ====== طبقة ١: وعي سياقي صامت ====== */
function lessonContext(title){
  return {
    abstract:/مفهوم|تعريف|أساس/.test(title),
    procedural:/حل|تطبيق|تمرين/.test(title),
    review:/مراجعة|تقويم/.test(title)
  };
}

/* ====== طبقة ٢ و٣ و٤: نواة دعم ذاتي متوازن ====== */
let minute=0, pressure=0, meaning=0, timer=null;

function complexity(title){
  let s=Math.max((title||'').length,10);
  if(/تطبيق|تحليل|حل|مشكلات|تقويم/.test(title)) s+=14;
  if(/مراجعة|تمهيد|تعريف/.test(title)) s-=8;
  return Math.max(s,10);
}
function slices(total){
  total=Math.min(Math.max(total||45,30),60);
  return [Math.round(total*0.24), Math.round(total*0.60), total];
}
function tick(){
  const e=[
    {p:1,m:0,t:'صمت طبيعي.'},
    {p:0,m:1,t:'محاولة واحدة غير مكتملة.'},
    {p:1,m:0,t:'تشتت خفيف قصير.'},
    {p:0,m:1,t:'تركيز قصير على الفكرة.'}
  ];
  return e[Math.floor(Math.random()*e.length)];
}
function prepare(title,min){
  const c=complexity(title);
  const [a,b,T]=slices(min);
  return `العنوان: ${title||'درس من الكتاب'}
المدة: ${T} دقيقة
تعقيد مُحتسب: ${c}
جلسة: ${SESSION_ID}

المسار:
0–${a} د: دخول هادئ.
${a}–${b} د: تشكّل جزئي للمعنى.
${b}–${T} د: شرط إغلاق محسوب.`;
}
function play(min,ctx){
  clearInterval(timer);
  minute=0; pressure=0; meaning=0;
  const [a,b,T]=slices(min);
  const box=document.getElementById('sim');
  box.textContent='بدء الحصة…';
  timer=setInterval(()=>{
    minute++;
    const e=tick(); pressure+=e.p; meaning+=e.m;

    /* ضبط ذاتي: لا مبالغة */
    if(meaning===0 && pressure<2 && minute>3){
      pressure=Math.max(0,pressure-1);
    }

    box.textContent+=`\n\nدقيقة ${minute}: ${e.t}\n(ضغط=${pressure} | معنى=${meaning})`;

    /* تنبؤ استباقي بالإغلاق */
    if(
      meaning>=2 ||
      pressure>=(ctx.abstract?3:4) ||
      minute>=Math.ceil(T*(ctx.review?0.6:0.7))
    ){
      box.textContent+='\n\nإغلاق إلزامي.'; clearInterval(timer);
    }
  },1200);
}
function tracking(title){
  const d=new Date().toLocaleDateString('ar-EG');
  return `جلسة: ${SESSION_ID}
الدرس: ${title||'—'}
التاريخ: ${d}

☐ حضور
☐ صمت طبيعي
☐ محاولة واحدة
☐ عدم تصويب علني
☐ إغلاق محسوب`;
}

/* ====== واجهة ====== */
function RUN(){
  if(!BOOK_APPROVED || timer!==null) return;
  const title=document.getElementById('title').value||'درس من الكتاب';
  const min=parseInt(document.getElementById('minutes').value)||45;
  const ctx=lessonContext(title);
  document.getElementById('prep').textContent=prepare(title,min);
  document.getElementById('track').textContent=tracking(title);
  play(min,ctx);
}
function RESET(){
  clearInterval(timer); timer=null;
  document.getElementById('prep').textContent='';
  document.getElementById('sim').textContent='';
  document.getElementById('track').textContent='';
}
</script>
</body>
</html>
