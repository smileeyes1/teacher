<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسطرة الإيقاف الصفّي — فلسطين</title>
<style>
:root{
  --bg:#eef2f5; --card:#fff; --accent:#1f5d80; --border:#ddd; --r:14px;
}
*{box-sizing:border-box;font-family:Tahoma}
body{margin:0;background:var(--bg);padding:12px}
.wrap{max-width:900px;margin:auto}
.card{
  background:var(--card);
  padding:12px;
  margin-bottom:12px;
  border-radius:var(--r);
  box-shadow:0 4px 14px rgba(0,0,0,.08)
}
h1,h2{margin:0 0 8px;color:var(--accent);font-size:18px}
p{margin:0;color:#444}
input,button,textarea{
  width:100%;
  padding:10px;
  margin-top:8px;
  font-size:14px;
  border-radius:10px;
  border:1px solid var(--border)
}
textarea{resize:none;height:64px}
button{background:var(--accent);color:#fff;border:none;cursor:pointer}
.zone{
  background:#fafafa;
  border:1px dashed #ccc;
  border-radius:12px;
  padding:12px;
  white-space:pre-wrap;
  line-height:1.8
}
.lock{opacity:.45;pointer-events:none}
.actions{display:grid;gap:8px}
@media print{
  input,button,textarea,.actions{display:none}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- عنوان -->
  <div class="card">
    <h1>مسطرة الإيقاف الصفّي المرتبطة بالكتاب</h1>
  </div>

  <!-- اعتماد الكتاب (شرط تشغيل) -->
  <div class="card" id="gateBook">
    <h2>اعتماد الكتاب (شرط تشغيل)</h2>
    <input type="file" id="bookFile" accept=".pdf,image/*">
    <input type="url" id="bookLink" placeholder="رابط رسمي معتمد (اختياري)">
    <div class="actions">
      <button onclick="approveBook()">اعتماد الكتاب</button>
    </div>
    <div class="zone" id="bookStatus">الحالة: غير معتمد.</div>
  </div>

  <!-- إدخال المثال والسؤال -->
  <div class="card lock" id="gateLesson">
    <h2>المثال والسؤال (من النص حرفيًا)</h2>
    <input id="title" placeholder="عنوان الدرس كما في الكتاب">
    <input id="page" placeholder="رقم الصفحة / الفقرة">
    <textarea id="example" placeholder="انسخ المثال كما هو من الكتاب (حرفيًا)"></textarea>
    <textarea id="question" placeholder="السؤال الواحد من نفس المثال"></textarea>
    <div class="actions">
      <button onclick="start()">ابدأ</button>
    </div>
  </div>

  <!-- التشغيل الصامت -->
  <div class="card lock" id="gateRun">
    <h2>سير الحصّة (تشغيل صامت)</h2>
    <div class="zone" id="runZone">بانتظار البدء…</div>
    <div class="actions">
      <button onclick="markAttempt()">حدثت محاولة / نُطقت الفكرة</button>
      <button onclick="print()">طباعة</button>
      <button onclick="resetAll()">إعادة</button>
    </div>
  </div>

  <!-- بطاقة الرصد -->
  <div class="card lock" id="gateTrack">
    <h2>بطاقة الإغلاق</h2>
    <div class="zone" id="trackZone"></div>
  </div>

</div>

<script>
// بوابة السيادة
let BOOK_OK=false, STARTED=false, CLOSED=false, T0=null;

function approveBook(){
  const f=document.getElementById('bookFile').files.length>0;
  const l=document.getElementById('bookLink').value.trim().length>0;
  if(!f && !l){
    document.getElementById('bookStatus').textContent='الحالة: فشل صامت (لم يُعتمد كتاب).';
    return;
  }
  BOOK_OK=true;
  document.getElementById('bookStatus').textContent='الحالة: مُعتمد كمنهاج رسمي وحيد.';
  unlock('gateLesson');
  unlock('gateRun');
  unlock('gateTrack');
}

function unlock(id){
  document.getElementById(id).classList.remove('lock');
}

function start(){
  if(!BOOK_OK || STARTED) return;
  const title=val('title'), page=val('page'), ex=val('example'), q=val('question');
  if(!ex || !q){ return; }
  STARTED=true; T0=Date.now();
  const run=document.getElementById('runZone');
  run.textContent=
    'عنوان الدرس: '+title+
    '\nالصفحة/الفقرة: '+page+
    '\n\nالسؤال طُرح.\nصمت…\nبانتظار محاولة.';
}

function markAttempt(){
  if(!STARTED || CLOSED) return;
  CLOSED=true;
  const dt=Math.max(0,Math.round((Date.now()-T0)/1000));
  document.getElementById('runZone').textContent+='\n\n⛔ إغلاق محسوب.';
  document.getElementById('trackZone').textContent=
    '⛔ هنا توقّفت.\n' +
    'مدة التفاعل (ثوانٍ): '+toArabicDigits(dt)+
    '\nالسبب: محاولة/نُطقت الفكرة.';
}

function resetAll(){
  BOOK_OK=false; STARTED=false; CLOSED=false; T0=null;
  ['title','page','example','question'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('bookStatus').textContent='الحالة: غير معتمد.';
  document.getElementById('runZone').textContent='بانتظار البدء…';
  document.getElementById('trackZone').textContent='';
  ['gateLesson','gateRun','gateTrack'].forEach(id=>{
    document.getElementById(id).classList.add('lock');
  });
}

function val(id){ return document.getElementById(id).value.trim(); }

// تحويل أرقام للعرض العربي الشرقي
function toArabicDigits(n){
  return String(n).replace(/\d/g, d=>'٠١٢٣٤٥٦٧٨٩'[d]);
}
</script>
</body>
</html>
