<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إنشاء محاكاة تعليمية عميقة</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: ١٦px;
    }

    .container {
      background: #ffffff;
      max-width: ٦٤٠px;
      margin: auto;
      padding: ٢٠px;
      border-radius: ١٠px;
      box-shadow: 0 ٤px ٨px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: ٢٠px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: ١٢px;
    }

    input, textarea, select {
      width: ١٠٠%;
      padding: ١٠px;
      margin-top: ٦px;
      border-radius: ٦px;
      border: ١px solid #ccc;
      font-size: ١٦px;
    }

    textarea {
      resize: vertical;
    }

    .option-group {
      margin-top: ٨px;
    }

    .option-group label {
      font-weight: normal;
      margin-left: ٨px;
    }

    button {
      margin-top: ٢٠px;
      width: ١٠٠%;
      padding: ١٤px;
      font-size: ١٨px;
      background-color: #1976d2;
      color: white;
      border: none;
      border-radius: ٨px;
      cursor: pointer;
    }

    button:hover {
      background-color: #125aa0;
    }

    .output {
      margin-top: ٢٤px;
    }

    .output textarea {
      height: ٤٢٠px;
      white-space: pre-wrap;
      font-family: "Tahoma", Arial, sans-serif;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>إنشاء محاكاة تعليمية عميقة</h2>

  <label>المادة</label>
  <input id="subject" placeholder="مثال: رياضيات – علوم – لغة عربية">

  <label>الصف</label>
  <input id="grade" placeholder="مثال: الثاني – الرابع">

  <label>الوحدة (اختياري)</label>
  <input id="unit" placeholder="اسم الوحدة إن وُجد">

  <label>الدرس أو المفهوم</label>
  <input id="lesson" placeholder="مثال: المقارنة بين عددين – الجملة الاسمية">

  <label>مستوى الطلبة</label>
  <select id="level">
    <option value="ضعاف">طلاب ضعاف</option>
    <option value="عادي" selected>صف عادي</option>
    <option value="موهوبين">طلاب موهوبين</option>
  </select>

  <label>نوع المحاكاة</label>
  <div class="option-group">
    <input type="radio" name="type" value="عميقة" checked>
    <label>عميقة</label><br>
    <input type="radio" name="type" value="علاجية">
    <label>علاجية</label><br>
    <input type="radio" name="type" value="إثرائية">
    <label>إثرائية</label>
  </div>

  <label>الهدف العميق (اختياري)</label>
  <textarea id="deepGoal" placeholder="ما الذي تريد أن يتغيّر في طريقة تفكير الطالب؟"></textarea>

  <button onclick="generateSimulation()">إنشاء المحاكاة</button>

  <div class="output">
    <label>ناتج المحاكاة</label>
    <textarea id="output" placeholder="ستظهر المحاكاة هنا..."></textarea>
  </div>
</div>

<script>
function generateSimulation() {
  const subject = document.getElementById("subject").value || "غير محددة";
  const grade = document.getElementById("grade").value || "غير محدد";
  const unit = document.getElementById("unit").value || "—";
  const lesson = document.getElementById("lesson").value || "—";
  const level = document.getElementById("level").value;
  const deepGoal = document.getElementById("deepGoal").value;
  const type = document.querySelector('input[name="type"]:checked').value;

  const simulation = `
محاكاة تعليمية ${type} – موجّهة بالأسئلة ومكيّفة حسب المستوى

المادة: ${subject}
الصف: ${grade}
الوحدة: ${unit}
الدرس / المفهوم: ${lesson}
مستوى الطلبة: ${level}

١) الافتراض الحدسي المتوقع:
غالبًا ما ينطلق الطالب من فهم تلقائي أو سطحي للمفهوم.

▸ السؤال الموجّه:
"لماذا يبدو هذا الفهم صحيحًا لك في البداية؟"

—

٢) موقف واقعي كاشف:
يقدّم المعلم موقفًا من حياة الطالب
يظهر أن الفهم الأولي غير كافٍ.

▸ السؤال:
"هل هذا التفسير وحده يكفي للتعامل مع الموقف؟ لماذا؟"

—

٣) تكييف المسار حسب المستوى:

▸ للطلبة الضعاف:
— تبسيط الموقف
— استخدام تمثيل حسي
▸ السؤال:
"ماذا يحدث لو غيّرنا جزءًا واحدًا فقط؟"

▸ للصف العادي:
— نقاش جماعي مفتوح
▸ السؤال:
"هل يمكن تفسير الموقف بطريقة أخرى؟"

▸ للطلبة الموهوبين:
— إضافة شرط جديد
▸ السؤال:
"هل يظل تفسيرك صحيحًا بعد هذا التغيير؟"

—

٤) الاحتكاك المعرفي:
تظهر تفسيرات متعددة ومتعارضة.

▸ السؤال:
"ما الشيء المشترك الذي تحتاجه كل الإجابات لتكون مقنعة؟"

—

٥) لحظة التحوّل المفاهيمي:
يقود المعلم الحوار حتى يكتشف الطلبة أن:
جوهر المفهوم، لا شكله، هو ما يحل المشكلة.

▸ السؤال:
"لو تجاهلنا المظهر، ما الذي يجب أن ننظر إليه فعلًا؟"

—

٦) التسمية أو القاعدة:
بعد الاكتشاف، يقدّم المعلم المصطلح أو القاعدة.

▸ سؤال تثبيت:
"كيف يعبّر هذا الاسم عمّا اكتشفناه؟"

—

٧) التطبيق الموجّه:
نشاط واحد فقط مناسب للمستوى.

▸ السؤال:
"ما الذي جعلك تختار هذا الحل دون غيره؟"

—

٨) نقل التعلّم:
ربط المفهوم بسياق جديد.

▸ السؤال:
"أين يمكن أن نحتاج هذا النوع من التفكير خارج هذا الدرس؟"

—

٩) التقويم العميق:
ليس اختبارًا بل تأملًا.

▸ السؤال الختامي:
"كيف ستفكر في موقف مشابه لاحقًا بشكل مختلف؟"

—

١٠) الأثر الذهني المتوقع:
الانتقال من فهم سطحي
إلى فهم أعمق وأكثر ثباتًا.

الهدف العميق:
${deepGoal || "بناء تغيير مستقر في طريقة تفكير الطالب، لا حفظ مؤقت."}

إرشاد للمعلم:
إذا أجاب الطالب بسرعة دون تردد،
فالسؤال يحتاج إعادة صياغة، لا شرح.
`;

  document.getElementById("output").value = simulation.trim();
}
</script>

</body>
</html>
