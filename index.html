<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Classroom Simulation Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  font-family:Tahoma;
  background:#111;
  color:#eee;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
#engine{
  background:#1e1e1e;
  border-radius:16px;
  padding:24px;
  max-width:600px;
  width:100%;
  box-shadow:0 0 40px rgba(0,0,0,.6);
}
h1{
  color:#6ab0f3;
  margin-top:0;
}
#log{
  background:#000;
  border-radius:10px;
  padding:16px;
  height:280px;
  overflow:auto;
  white-space:pre-line;
  font-size:15px;
}
button{
  width:100%;
  margin-top:16px;
  padding:14px;
  font-size:16px;
  border:none;
  border-radius:10px;
  background:#6ab0f3;
  color:#000;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="engine">
  <h1>محرك محاكاة صفّية حقيقة</h1>
  <div id="log"></div>
  <button onclick="run()">تشغيل الحصّة</button>
</div>

<script>
const timeline = [
  "🔔 بداية الحصّة.\nالطلبة يدخلون.\nالصف غير متحمّس بعد.",
  "📖 المعلّم يفتح الكتاب.\nلا شرح إضافي.\nسؤال واحد فقط.",
  "⏳ الصمت يسود لثوانٍ.\nلا أحد يُجيب فورًا.",
  "🧠 النظام يقرّر:\nهذا صمت صحي.\nلا تدخل.",
  "👤 طالب واحد يرفع يده.\nالإجابة غير مكتملة.",
  "✅ القرار الآلي:\nالمحاولة مقبولة.\nلا تصويب.\nلا ضغط.",
  "🛑 إغلاق الحصّة:\nالهدف تحقّق.\nالتوقّف الآن صحيح.",
  "✅ نهاية الحصّة.\nما حدث كافٍ.\nلا مراجعة.\nلا ندم."
];

let i = 0;
let timer;

function run(){
  clearInterval(timer);
  document.getElementById("log").textContent="";
  i = 0;

  timer = setInterval(()=>{
    document.getElementById("log").textContent += timeline[i] + "\n\n";
    i++;
    if(i === timeline.length){
      clearInterval(timer);
    }
  }, 1800);
}
</script>

</body>
</html>
