<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الداعم التشغيلي الكامل للمعلم الفلسطيني</title>
<style>
:root{--bg:#eef2f5;--card:#fff;--accent:#1f5d80;--border:#ddd;--r:14px}
*{box-sizing:border-box;font-family:Tahoma}
body{margin:0;background:var(--bg);padding:16px}
.wrap{max-width:1100px;margin:auto}
.card{background:var(--card);padding:16px;margin-bottom:16px;border-radius:var(--r);
box-shadow:0 4px 16px rgba(0,0,0,.08)}
h1,h2{margin:0 0 8px;color:var(--accent)}
input,button{width:100%;padding:12px;margin-top:8px;font-size:15px;border-radius:10px;border:1px solid var(--border)}
button{background:var(--accent);color:#fff;border:none;cursor:pointer}
.zone{background:#fafafa;border:1px dashed #ccc;border-radius:12px;padding:14px;white-space:pre-wrap;line-height:1.7}
.actions{display:flex;gap:8px;margin-top:8px}
.actions button{flex:1}
@media print{input,button,.actions{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card"><h1>الداعم التشغيلي الكامل للمعلم الفلسطيني</h1></div>

  <div class="card">
    <h2>مدخل وحيد</h2>
    <input id="title" placeholder="عنوان الدرس كما في الكتاب المدرسي الفلسطيني">
    <input id="minutes" type="number" placeholder="مدة الحصة بالدقائق">
    <button onclick="RUN()">تشغيل</button>
  </div>

  <div class="card">
    <h2>تنظيم الحصة (آلي)</h2>
    <div id="prep" class="zone"></div>
  </div>

  <div class="card">
    <h2>سير الحصة (تشغيل صامت محسوب)</h2>
    <div id="sim" class="zone"></div>
    <div class="actions">
      <button onclick="print()">طباعة</button>
      <button onclick="RESET()">إعادة</button>
    </div>
  </div>

  <div class="card">
    <h2>قائمة الرصد (ناتجة عن المسار)</h2>
    <div id="track" class="zone"></div>
  </div>
</div>

<script>
/* ====== نواة حاسبة داعمة (لا شرح، لا خيارات) ====== */
let minute=0, pressure=0, meaning=0, timer=null;

/* اشتقاق بسيط من العنوان (لا تفسير) */
function complexity(title){
  let s=Math.max((title||'').length,10);
  if(/تطبيق|تحليل|حل|مشكلات|تقويم/.test(title)) s+=14;
  if(/مراجعة|تمهيد|تعريف/.test(title)) s-=8;
  return Math.max(s,10);
}

/* تقسيم زمن محافظ (واقعي) */
function slices(total){
  total=Math.min(Math.max(total||45,30),60);
  return [Math.round(total*0.24), Math.round(total*0.60), total];
}

/* أحداث صفّية طبيعية (سلوكية) */
function tick(){
  const e=[
    {p:1,m:0,t:"صمت طبيعي."},
    {p:0,m:1,t:"محاولة واحدة غير مكتملة."},
    {p:1,m:0,t:"تشتت خفيف قصير."},
    {p:0,m:1,t:"تركيز قصير على الفكرة."}
  ];
  return e[Math.floor(Math.random()*e.length)];
}

/* تحضير آلي مختصر (بدون قوالب) */
function prepare(title,min){
  const c=complexity(title);
  const [a,b,T]=slices(min);
  return `العنوان: ${title||"درس من الكتاب"}
المدة: ${T} دقيقة
تعقيد محتسب: ${c}

المسار:
0–${a} د: دخول هادئ.
${a}–${b} د: تشكّل جزئي للمعنى.
${b}–${T} د: شرط إغلاق محسوب.`;
}

/* تشغيل صامت يقرّر وحده */
function play(min){
  clearInterval(timer);
  minute=0; pressure=0; meaning=0;
  const [a,b,T]=slices(min);
  const box=document.getElementById("sim");
  box.textContent="⏳ بدء الحصة…";
  timer=setInterval(()=>{
    minute++;
    const e=tick(); pressure+=e.p; meaning+=e.m;
    box.textContent+=`\n\n⏱ دقيقة ${minute}: ${e.t}\n(ضغط=${pressure} | معنى=${meaning})`;
    if(meaning>=2 || pressure>=4 || minute>=Math.ceil(T*0.7)){
      box.textContent+=`\n\n🛑 إغلاق إلزامي.`; clearInterval(timer);
    }
  },1200);
}

/* رصد بسيط مشتق */
function tracking(title){
  const d=new Date().toLocaleDateString('ar-EG');
  return `الدرس: ${title||"—"}
التاريخ: ${d}

☐ حضور
☐ صمت طبيعي
☐ محاولة واحدة
☐ عدم تصويب علني
☐ إغلاق محسوب`;
}

/* واجهة وحيدة */
function RUN(){
  const title=document.getElementById("title").value||"درس من الكتاب";
  const min=parseInt(document.getElementById("minutes").value)||45;
  document.getElementById("prep").textContent=prepare(title,min);
  document.getElementById("track").textContent=tracking(title);
  play(min);
}
function RESET(){
  clearInterval(timer);
  document.getElementById("prep").textContent="";
  document.getElementById("sim").textContent="";
  document.getElementById("track").textContent="";
}
</script>
</body>
</html>
