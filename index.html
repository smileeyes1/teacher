<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الداعم الواقعي للمعلم الفلسطيني</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Tahoma, Arial, sans-serif;
  background:#f6f7f8;
  margin:0;
  color:#222;
  line-height:1.8;
}
.container{
  max-width:850px;
  margin:auto;
  padding:24px;
  background:#fff;
}
h1{text-align:center;border-bottom:2px solid #ccc;padding-bottom:10px;}
.section{margin-top:22px;}
input, textarea, select{
  width:100%;
  padding:10px;
  margin-top:6px;
}
button{
  width:100%;
  padding:16px;
  margin-top:14px;
  font-size:1rem;
  border:none;
  background:#eaeaea;
  cursor:pointer;
}
button:hover{background:#dcdcdc;}
.output{
  background:#f0f0f0;
  border-right:4px solid #777;
  padding:16px;
  margin-top:20px;
  display:none;
}
.footer{
  margin-top:40px;
  border-top:1px solid #ccc;
  padding-top:14px;
  text-align:center;
  color:#666;
}
</style>

<script>
function generate(){
  const role = document.getElementById("role").value;
  const idea = document.getElementById("idea").value;
  const context = document.getElementById("context").value;

  let text = "";

  if(role==="organize"){
    text = `تنظيم الموقف:\n\nنركّز اليوم على فكرة واحدة فقط: ${idea}.\nنُبقي الشرح في حدّه الأدنى، ونغلق الحصة عند أول محاولة.`;
  }
  if(role==="explain"){
    text = `شرح مبسّط:\n\nالفكرة الأساس هي: ${idea}.\nنطرح سؤالًا واحدًا فقط، وننتظر دون ضغط.`;
  }
  if(role==="analyze"){
    text = `تحليل واقعي:\n\nالسياق الحالي (${context}) لا يحتمل توسّعًا.\nالمحاولة الجزئية كافية، والضغط سيضرّ التعلّم.`;
  }
  if(role==="plan"){
    text = `خطة قصيرة جدًا:\n\n١) فكرة واحدة: ${idea}\n٢) سؤال واحد\n٣) إغلاق عند أول محاولة`;
  }
  if(role==="choose"){
    text = `الاختيار المهني:\n\nأفضل قرار الآن هو الإغلاق الهادئ.\nهذا يحميك ويحفظ استقرار الطلبة.`;
  }
  if(role==="fill"){
    text = `نص مكتمل:\n\nتم تنفيذ الحصة وفق فكرة "${idea}".\nوبسبب السياق ${context}، تم الإغلاق عند اللحظة المناسبة مهنيًا.`;
  }

  document.getElementById("result").innerText=text;
  document.getElementById("result").style.display="block";
}
</script>
</head>

<body>
<div class="container">

<h1>الداعم المهني للمعلم الفلسطيني</h1>
<p style="text-align:center;">
اختر ما تحتاجه الآن، وخذ ناتجًا واحدًا مكتملًا.
</p>

<div class="section">
<label>ما الدور الذي تريده الآن؟</label>
<select id="role">
  <option value="organize">نظّم لي</option>
  <option value="explain">اشرح لي</option>
  <option value="analyze">حلّل لي</option>
  <option value="plan">اكتب خطة قصيرة</option>
  <option value="choose">اختر واحدًا</option>
  <option value="fill">املأ الفراغ</option>
</select>
</div>

<div class="section">
<label>فكرة واحدة من الكتاب:</label>
<input id="idea" placeholder="اكتب الفكرة باختصار">
</div>

<div class="section">
<label>وصف السياق (مستقر / متقلّب / ضغط):</label>
<input id="context" placeholder="مثال: الصف متعب – الوقت قصير">
</div>

<button onclick="generate()">نفّذ</button>

<div id="result" class="output"></div>

<div class="footer">
هذا الداعم لا يقيّمك ولا يضغطك.
إذا خرجت مرتاحًا، فهذا يكفي.
</div>

</div>
</body>
</html>
