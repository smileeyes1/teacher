<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المرافق الصامت للحصّة | المنهاج الفلسطيني</title>

<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --accent:#1f5d80;
  --soft:#e9f2f7;
  --text:#222;
  --muted:#666;
  --border:#ddd;
  --radius:14px;
  --font:14px;
}
*{
  box-sizing:border-box;
  font-family:"Tahoma","Segoe UI",sans-serif;
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  padding:16px;
  font-size:var(--font);
}
.wrapper{max-width:960px;margin:auto;}

.card{
  background:var(--card);
  padding:20px;
  margin-bottom:16px;
  border-radius:var(--radius);
  box-shadow:0 4px 16px rgba(0,0,0,.06);
}
h1{margin:0 0 8px;color:var(--accent);font-size:22px;}
h2{margin:0 0 6px;font-size:18px;}
p{margin:0;color:var(--muted);line-height:1.7;}

input,select,textarea,button{
  width:100%;
  padding:14px;
  margin-top:10px;
  font-size:15px;
  border-radius:12px;
  border:1px solid var(--border);
}
textarea{min-height:140px;resize:vertical;}
button{
  background:var(--accent);
  color:#fff;
  border:none;
  cursor:pointer;
}
button.secondary{background:#aaa;}
button.light{background:#ddd;color:#000;}

.note{
  background:var(--soft);
  padding:12px;
  border-radius:12px;
  margin-top:10px;
  font-size:14px;
}

output{
  display:block;
  background:#fafafa;
  border:1px dashed #ccc;
  padding:16px;
  margin-top:16px;
  border-radius:12px;
  white-space:pre-wrap;
  font-size:14px;
}

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

@media(max-width:600px){
  h1{font-size:20px;}
  h2{font-size:17px;}
}
@media print{
  body{background:#fff;}
  input,select,textarea,button,.controls{display:none;}
}
</style>
</head>

<body>
<div class="wrapper">

<!-- ===== الشاشة الأولى: الطمأنة ===== -->
<div class="card">
  <h1>المرافق الصامت للحصّة</h1>
  <p>
    دعم واقعي قبل الحصّة فقط.<br>
    يكفي استخدام ما هو موجود في الكتاب.<br>
    ما سيحدث في الحصّة محلول مسبقًا.
  </p>
</div>

<!-- ===== الشاشة الثانية: الربط بالكتاب ===== -->
<div class="card">
  <h2>١) بيانات الدرس من الكتاب</h2>

  <input id="lessonTitle" placeholder="اسم الدرس كما في الكتاب (مثال: مكونات العدد ٥)">

  <select id="grade">
    <option>الصف الأوّل</option>
    <option>الصف الثاني</option>
    <option>المرحلة الأساسية العليا</option>
    <option>المرحلة الثانوية</option>
  </select>

  <select id="subject">
    <option>الرياضيات</option>
    <option>اللغة العربية</option>
    <option>العلوم</option>
    <option>التربية الوطنية</option>
  </select>

  <input id="page" type="number" placeholder="رقم الصفحة في الكتاب">

  <textarea id="lessonText" placeholder="ألصق هنا نص الدرس كما هو من الكتاب (للاستخدام التحليلي فقط)"></textarea>

  <div class="note">
    ✅ لا يُطلب منك تحديد أهداف أو أنشطة.<br>
    ✅ النص يُستخدم لتحليل نوع الدرس فقط، ولن يُعرض أو يُحفظ.
  </div>

  <button onclick="analyzeLesson()">حضّر مسار الحصّة من الكتاب</button>
</div>

<!-- ===== النتيجة ===== -->
<div class="card" id="result"></div>

</div>

<script>
function analyzeLesson(){
  if(!lessonTitle.value || !page.value || !lessonText.value){
    alert("يرجى إدخال اسم الدرس ورقم الصفحة ونص الدرس.");
    return;
  }

  const text = lessonText.value.toLowerCase();

  let lessonType = "عام";

  if(text.includes("عد") || text.includes("اكتب") || text.includes("قارن")){
    lessonType = "عددي";
  }
  if(text.includes("اقرأ") || text.includes("قراءة") || text.includes("نص")){
    lessonType = "قرائي";
  }
  if(text.includes("لاحظ") || text.includes("صورة") || text.includes("شاهد")){
    lessonType = "بصري";
  }

  buildLessonPath(lessonType);
}

function buildLessonPath(type){

  const header =
`مسار حصّة — معتمد رسميًا

اسم الدرس: ${lessonTitle.value}
الصف: ${grade.value}
المبحث: ${subject.value}
الصفحة: ${page.value}
المرجع: الكتاب المدرسي الفلسطيني الحكومي

نوع الدرس (حسب النص): ${type}

`;

  let body = "";

  if(type === "عددي"){
    body = `
الدرس ذو طبيعة عددية.

المتوقّع طبيعيًا:
- تردّد
- أخطاء في العد أو المقارنة
- مشاركة جزئية

المسار المعتمد:
السؤال من الكتاب.
قبول أول محاولة.
الإغلاق بعد المحاولة الأولى صحيح.
`;
  }

  if(type === "قرائي"){
    body = `
الدرس ذو طبيعة قرائية.

المتوقّع طبيعيًا:
- صمت
- قراءة فردية
- تردّد عام

المسار المعتمد:
السؤال من الكتاب.
تطبيع التردّد.
الإغلاق بعد أول محاولة أو صمت كامل صحيح.
`;
  }

  if(type === "بصري"){
    body = `
الدرس ذو طبيعة بصرية.

المتوقّع طبيعيًا:
- ملاحظات غير دقيقة
- وصف عام للصورة
- مشاركة محدودة

المسار المعتمد:
السؤال من الكتاب.
تثبيت الملاحظة دون تعميق.
الإغلاق دون توسّع صحيح.
`;
  }

  if(type === "عام"){
    body = `
الدرس ذو طبيعة عامة.

المتوقّع طبيعيًا:
- مشاركة جزئية
- صمت
- إجابات تقريبية

المسار المعتمد:
السؤال من الكتاب.
قبول المحاولة.
الإغلاق بعد أول تفاعل أو صمت كامل صحيح.
`;
  }

  const encouragement =
`----------------------------------
ملاحظة داعمة:
بهذا التحضير أنت جاهز.
ما سيحدث في الحصّة كافٍ مهنيًا.
لا حاجة للإضافة أو القلق.
----------------------------------
`;

  result.innerHTML = `
    <h2>وثيقة مسار الحصّة</h2>
    <output>${header}${body}${encouragement}</output>
    <div class="note">
      📌 اطبع هذه الوثيقة وادخل الحصّة مباشرة.<br>
      لا تحتاج لمراجعتها أثناء الدرس.
    </div>
    <button class="secondary" onclick="window.print()">طباعة الوثيقة</button>
  `;
}
</script>

</body>
</html>
